name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Prepare APK Build Environment
        run: |
          echo "Gunx Analysis Bot - APK Environment Ready"
          python -m pip install --upgrade pip
          pip install kivy
