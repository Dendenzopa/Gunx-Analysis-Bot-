

name: GUNX ANALYSIS BOT APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Linux Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip \
            build-essential \
            autoconf automake \
            libtool libltdl-dev \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo5 \
            cmake libffi-dev libssl-dev

      - name: Install Python Build Tools
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install buildozer Cython==0.29.34

      - name: Check Project Files
        run: |
          ls -la
          test -f main.py
          test -f analyzer.py
          test -f gui_app.py
          test -f markets.py
          test -f buildozer.spec
          python -m compileall -q .

      - name: Cache Buildozer
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: gunx-buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            gunx-buildozer-${{ runner.os }}-

      - name: Build Android APK
        run: |
          set -o pipefail
          buildozer -v android debug 2>&1 | tee buildozer.log

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GUNX-ANALYSIS-BOT-APK
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload Build Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GUNX-BUILD-LOGS
          path: buildozer.log
          if-no-files-found: warn
          retention-days: 7
