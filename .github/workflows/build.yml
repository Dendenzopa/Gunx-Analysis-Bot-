name: GUNX ANALYSIS BOT APK BUILD

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Linux Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip \
            build-essential \
            autoconf automake \
            libtool libltdl-dev \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo5 \
            cmake \
            libffi-dev \
            libssl-dev \
            libsqlite3-dev \
            libjpeg-dev \
            libpng-dev

      - name: Install Python Build Tools
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "Cython<3" buildozer

      - name: Check Project Files
        run: |
          set -euxo pipefail
          test -f main.py
          test -f gui_app.py
          test -f markets.py
          test -f api.py
          test -f buildozer.spec
          python -m compileall -q .
          echo "All required project files found."

      - name: Build GUNX Android APK
        run: |
          set -euxo pipefail
          # Tumeondoa "buildozer -v android clean" hapa chini ili isitafute folda isiyokuwepo
          buildozer -v android debug 2>&1 | tee buildozer.log

      - name: Upload GUNX APK
        uses: actions/upload-artifact@v4
        with:
          name: GUNX-ANALYSIS-BOT-APK
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload Build Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GUNX-BUILD-LOGS
          path: buildozer.log
          if-no-files-found: warn
          retention-days: 7
